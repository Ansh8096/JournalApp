spring:
  application:
    name: "Journal Application"
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: journaldb
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true


  # Because of this properties 'JavaMAilSender' object will get initialized...
  mail:
    host: smtp.gmail.com
    port: 587 # In case when we used encryption...
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true # 'true' means data exchange will be encrypted...

# Kafka Properties:--
  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: weekly-mood-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: net.engineerAnsh.journalApp.model

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
    syntaxHighlight:
      theme: Monokai

app:
  cors:
    allowed-origin: ${ALLOWED_ORIGIN}
  images:
    max-count: 5
    max-size: 5 * 1024 * 1024 # 5MB

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  profile-image-folder: ${CLOUDINARY_PROFILE_IMAGE_FOLDER}
  journal-image-folder: ${CLOUDINARY_JOURNAL_IMAGE_FOLDER}

journal:
  tags:
    max-count: 10
    max-length: 30

weather:
  openweather:
    base-url: https://api.openweathermap.org/data/2.5/weather
    geocoding-url: https://api.openweathermap.org/geo/1.0/direct
    api-key: ${OPENWEATHER_API_KEY}
    units: metric
    temperature-unit: "°C"
    wind-speed-unit: "m/s"
    cache-ttl-seconds: 600