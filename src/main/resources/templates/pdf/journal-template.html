<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8" />

    <title>Journal Export</title>

    <style th:utext="${styles}"></style>

</head>

<body>

<div class="page">

    <div class="top-accent"></div>

    <header class="doc-header">

        <p class="brand">JournalFlow</p>

        <h1 th:text="${journal.title}"></h1>

        <div class="header-rule"></div>

        <div class="info-card">

            <div class="meta-item">
                <span class="meta-label">Mood</span>
                <span class="meta-value" th:text="${journal.mood}"></span>
            </div>

            <div class="meta-item">
                <span class="meta-label">Favorite</span>
                <span
                        class="meta-value"
                        th:text="${journal.favorite ? 'Yes' : 'No'}"
                ></span>
            </div>

            <div class="meta-item meta-item-last">
                <span class="meta-label">Created</span>
                <span class="meta-value" th:text="${#temporals.format(journal.createdAt, 'dd MMMM yyyy • hh:mm a')}"> </span>
            </div>

        </div>

        <div class="tags">

            <span
                    class="tag"
                    th:each="tag : ${journal.tags}"
                    th:text="${tag}"
            ></span>

        </div>

    </header>

    <div class="section-divider"></div>

    <div
            class="journal-content"
            th:utext="${journal.content}"
    ></div>

    <div
            class="gallery-section"
            th:if="${!journal.images.isEmpty()}"
    >

        <div class="section-divider"></div>

        <h2>Images</h2>

        <div class="gallery">

            <div
                    class="gallery-item"
                    th:each="image : ${journal.images}"
            >
                <img
                        th:src="${image.imageUrl}"
                        class="gallery-image"
                />
            </div>

        </div>

    </div>

    <footer>

        <div class="footer-rule"></div>

        <p>Generated by JournalFlow</p>

    </footer>

</div>

</body>

</html>
